# Ruch z kamery Aqara (jest w Apple Home przez HomeKit, więc HA nie widzi jej bezpośrednio).
#
# input_boolean.kamera_ruch trafia do Apple Home przez HomeKit Bridge jako przełącznik.
# W aplikacji Dom dwie automatyzacje: „gdy kamera wykryje ruch → włącz Kamera ruch”
# i „gdy ruch ustanie → wyłącz Kamera ruch”. Gdyby wyłączenie nie dotarło, HA zrobi to sam
# po 10 minutach. binary_sensor.ruch_kamera to czujnik ruchu do automatyzacji.
# Celowo input_boolean, a nie switch – skrypty „wyłącz światła” i liczniki świateł biorą wszystkie switch.*.

input_boolean:
  kamera_ruch:
    name: "Kamera ruch"
    icon: mdi:motion-sensor

template:
  - binary_sensor:
      - name: "Ruch kamera"
        unique_id: dom_kamera_ruch
        device_class: motion
        state: "{{ is_state('input_boolean.kamera_ruch', 'on') }}"

automation:
  - id: dom_kamera_ruch_reset
    alias: "Kamera: zresetuj ruch po 10 minutach (zabezpieczenie)"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.kamera_ruch
        to: "on"
        for: "00:10:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kamera_ruch

  # Garaż: ruch włącza światło, gaśnie minutę po ostatnim ruchu.
  - id: dom_garaz_swiatlo_ruch
    alias: "Garaż: światło na ruch"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.ruch_kamera
        to: "on"
        id: ruch
      - trigger: state
        entity_id: binary_sensor.ruch_kamera
        to: "off"
        for: "00:01:00"
        id: cisza
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: ruch
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: [switch.garaz_1, switch.garaz_2]
          - conditions:
              - condition: trigger
                id: cisza
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: [switch.garaz_1, switch.garaz_2]
