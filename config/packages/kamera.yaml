# Ruch z kamery Aqara (jest w Apple Home przez HomeKit, więc HA nie widzi jej bezpośrednio).
#
# input_boolean.kamera_ruch trafia do Apple Home przez HomeKit Bridge jako przełącznik.
# W aplikacji Dom automatyzacja: „gdy kamera wykryje ruch → włącz Kamera ruch”.
# HA wyłącza go po 5 s, żeby każde kolejne wykrycie było nowym impulsem „on”.
# binary_sensor.ruch_kamera = impuls ruchu; automatyzacje liczą czas od ostatniego impulsu.
# Celowo input_boolean, a nie switch – skrypty „wyłącz światła” i liczniki świateł biorą wszystkie switch.*.

input_boolean:
  kamera_ruch:
    name: "Kamera ruch"
    icon: mdi:motion-sensor

# Po zgaszeniu światła w garażu kamera widzi zmianę obrazu jako ruch i zapalała je z powrotem
# (pętla co ~65 s). Przez 30 s po każdym zgaszeniu (automatycznym, ręcznym, zdalnym) ruch jest ignorowany.
timer:
  garaz_po_zgaszeniu:
    name: "Garaż: przerwa po zgaszeniu"
    duration: "00:00:30"

template:
  - binary_sensor:
      - name: "Ruch kamera"
        unique_id: dom_kamera_ruch
        device_class: motion
        state: "{{ is_state('input_boolean.kamera_ruch', 'on') }}"

automation:
  - id: dom_kamera_ruch_reset
    alias: "Kamera: zresetuj impuls ruchu"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.kamera_ruch
        to: "on"
        for: "00:00:05"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kamera_ruch

  # Garaż: ruch włącza światło, gaśnie minutę po ostatnim impulsie ruchu.
  # Każdy nowy impuls (off→on) przerywa odliczanie, więc ruch przedłuża światło o kolejną minutę.
  - id: dom_garaz_swiatlo_ruch
    alias: "Garaż: światło na ruch"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.ruch_kamera
        to: "on"
        id: ruch
      - trigger: state
        entity_id: binary_sensor.ruch_kamera
        to: "off"
        for: "00:01:00"
        id: cisza
      - trigger: state
        entity_id: [switch.garaz_1, switch.garaz_2]
        from: "on"
        to: "off"
        id: zgaszone
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: ruch
              - condition: state
                entity_id: timer.garaz_po_zgaszeniu
                state: idle
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: [switch.garaz_1, switch.garaz_2]
          - conditions:
              - condition: trigger
                id: cisza
            sequence:
              - action: timer.start
                target:
                  entity_id: timer.garaz_po_zgaszeniu
              - action: switch.turn_off
                target:
                  entity_id: [switch.garaz_1, switch.garaz_2]
          - conditions:
              - condition: trigger
                id: zgaszone
            sequence:
              - action: timer.start
                target:
                  entity_id: timer.garaz_po_zgaszeniu
